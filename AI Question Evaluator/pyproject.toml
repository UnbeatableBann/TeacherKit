[project]
name = "ai-evaluation-engine"
version = "0.1.0"
description = "Domain-specific educational answer evaluation engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "pydantic>=2.11,<3.0",
    "scalar-fastapi>=1.8.2",
    "openai>=3.1.0",
    "pydantic-settings>=2.15.0",
    "google-genai>=2.18.1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1.0", "pytest>=8.4,<9.0", "ruff>=0.12,<1.0", "mypy>=1.17,<2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
